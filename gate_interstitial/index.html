<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate.tr Interstitial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f0f0; /* Just for contrast when viewing the file directly */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .ad-container {
            width: 320px;
            height: 480px;
            background: radial-gradient(circle at top right, #1a2a3a, #0d1318);
            position: relative;
            overflow: hidden;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 8px; /* Optional rounded corners */
        }

        /* Close Button */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 18px;
            line-height: 24px;
            cursor: pointer;
            z-index: 100;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Background Effect (Subtle Grid) */
        .background-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 1;
            animation: panBackground 20s linear infinite;
        }

        @keyframes panBackground {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-20px, -20px); }
        }

        .content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Logo */
        .logo-container {
            margin-bottom: 20px;
            animation: fadeInDown 1s ease-out;
        }

        .gate-logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 10px;
        }

        .logo-container h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Typography */
        .headline {
            font-size: 26px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #00D395);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.3s forwards;
        }

        .subtext {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.6s forwards;
        }

        /* Chart Animation */
        .chart-animation {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            height: 40px;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.9s forwards;
        }

        .bar {
            width: 8px;
            background-color: #00D395;
            border-radius: 2px 2px 0 0;
            animation: chartGrow 1.5s infinite alternate ease-in-out;
        }

        .bar:nth-child(1) { height: 20%; animation-delay: 0.1s; }
        .bar:nth-child(2) { height: 50%; animation-delay: 0.2s; }
        .bar:nth-child(3) { height: 80%; animation-delay: 0.3s; }
        .bar:nth-child(4) { height: 60%; animation-delay: 0.4s; }
        .bar:nth-child(5) { height: 90%; animation-delay: 0.5s; }

        @keyframes chartGrow {
            0% { height: 20%; opacity: 0.5; }
            100% { height: 100%; opacity: 1; }
        }

        /* CTA Button */
        .cta-button {
            background-color: #00D395;
            color: #0d1318;
            text-decoration: none;
            font-weight: 700;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 0 15px rgba(0, 211, 149, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            opacity: 0;
            animation: fadeInUp 1s ease-out 1.2s forwards;
            cursor: pointer;
            display: inline-block;
        }

        .cta-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 211, 149, 0.6);
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="ad-container">
        <button class="close-btn" id="closeBtn">&times;</button>
        <div class="background-effect"></div>
        <div class="content">
            <div class="logo-container">
                <div class="gate-logo">
                    <!-- Simple SVG representation of a Gate-like logo -->
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 10C27.9086 10 10 27.9086 10 50C10 72.0914 27.9086 90 50 90C72.0914 90 90 72.0914 90 50" stroke="#00D395" stroke-width="8" stroke-linecap="round"/>
                        <path d="M90 50H50V25" stroke="#00D395" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1>Gate.tr</h1>
            </div>
            <h2 class="headline">Kripto Dünyasına<br>Açılan Kapınız</h2>
            <p class="subtext">Güvenilir. Hızlı. Yenilikçi.</p>
            <div class="chart-animation">
                <!-- CSS animated bars -->
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <a href="https://www.gate.tr/tr" target="_blank" class="cta-button">Hemen Başla</a>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const closeBtn = document.getElementById('closeBtn');

            closeBtn.addEventListener('click', () => {
                // In a real ad environment (e.g., Google Ad Manager), this would close the ad.
                // For this demo, we'll fade out the container.
                const container = document.querySelector('.ad-container');
                container.style.transition = 'opacity 0.5s';
                container.style.opacity = '0';

                setTimeout(() => {
                    // Optional: Remove from DOM or reset
                    // container.style.display = 'none';
                    console.log('Ad closed');

                    // Just for demo purposes, reload/reset after a few seconds so it can be seen again
                    /*
                    setTimeout(() => {
                        container.style.opacity = '1';
                    }, 1000);
                    */
                }, 500);
            });
        });
    </script>
</body>
</html>
