<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gate.tr Cross Slider</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      background-color: #000;
      touch-action: none; /* Prevent scrolling */
    }

    #ad-container {
      position: relative;
      width: 320px;
      height: 480px;
      margin: 0 auto;
      background-color: #1a1a1a;
      overflow: hidden;
      border: 1px solid #333;
      touch-action: none;
    }

    /* Close Button */
    #close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 24px;
      height: 24px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 50%;
      color: white;
      text-align: center;
      line-height: 24px;
      font-size: 16px;
      cursor: pointer;
      z-index: 1000;
      pointer-events: auto;
      font-weight: bold;
    }

    /* Base Layer (The Video) */
    .video-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
      /* Fallback background if video fails to load */
      background: linear-gradient(135deg, #1e1e1e 0%, #00D395 100%);
    }

    .video-layer::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
        background-size: 20px 20px;
        opacity: 0.3;
        z-index: 0;
    }

    .video-layer video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: relative;
      z-index: 1;
    }

    /* Overlay Layer (The Cover Image/Reveal) */
    .overlay-layer {
      position: absolute;
      width: 50%; /* Start halfway */
      height: 100%;
      top: 0;
      left: 0;
      z-index: 2;
      overflow: hidden;
      background-color: #1a1a1a;
      border-right: 3px solid #00D395; /* Gate.tr Green border */
    }

    /* Content inside overlay layer - fixed width to be clipped */
    .overlay-content {
      width: 320px; /* Match container width */
      height: 480px;
      position: absolute;
      top: 0;
      left: 0;
      background: linear-gradient(135deg, #111 0%, #222 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Slider Handle */
    .slider-handle {
      position: absolute;
      z-index: 10;
      width: 40px;
      height: 40px;
      top: 50%;
      left: 50%; /* Start halfway */
      transform: translate(-50%, -50%);
      background-color: #00D395;
      border-radius: 50%;
      cursor: ew-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(0,211,149, 0.5);
    }

    .slider-handle::after {
      content: '↔';
      color: #fff;
      font-size: 20px;
      font-weight: bold;
    }

    /* Branding */
    .logo {
      width: 60%; /* Adjusted width */
      max-width: 150px;
      max-height: 80px;
      margin-bottom: 20px;
      object-fit: contain;
      /* Removed invert filter to show logo naturally, assuming correct asset */
      filter: brightness(0) invert(1); /* Force white logo on dark background per guidelines */
    }

    .instruction-text {
      color: #fff;
      font-size: 14px; /* Smaller font */
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    .sub-text {
        color: #00D395;
        font-size: 10px;
        margin-top: 5px;
        opacity: 0.8;
    }

    /* Click area link */
    .click-overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 5;
    }

  </style>
</head>

    <div id="slider-handle" class="slider-handle"></div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('ad-container');
      const overlay = document.getElementById('overlay');
      const handle = document.getElementById('slider-handle');
      let isDragging = false;

      // Close button functionality
      document.getElementById('close-btn').addEventListener('click', (e) => {
        e.stopPropagation(); // Prevent triggering link
        container.style.display = 'none';
        console.log('Ad Closed');
      });

      // Slider logic
      const getX = (e) => {
        if (e.changedTouches && e.changedTouches[0]) {
          return e.changedTouches[0].pageX;
        }
        return e.pageX;
      };

      const move = (e) => {
        if (!isDragging) return;

        const rect = container.getBoundingClientRect();
        let x = getX(e) - rect.left;

        // Boundaries
        if (x < 0) x = 0;
        if (x > rect.width) x = rect.width;

        // Update overlay width and handle position
        overlay.style.width = `${x}px`;
        handle.style.left = `${x}px`;
      };

      const start = (e) => {
        // Only start dragging if clicking the handle or overlay area?
        // Better UX: Allow dragging from anywhere in container for this demo
        isDragging = true;
        move(e); // Snap to click/touch
      };

      const end = () => {
        isDragging = false;
      };

      // Event Listeners
      container.addEventListener('mousedown', start);
      container.addEventListener('touchstart', start, {passive: false});

      window.addEventListener('mousemove', move);
      window.addEventListener('touchmove', move, {passive: false});

      window.addEventListener('mouseup', end);
      window.addEventListener('touchend', end);

      // Auto-slide animation
      setTimeout(() => {
          let pos = 50;
          let direction = 1;
          const animate = setInterval(() => {
              if (isDragging) {
                  clearInterval(animate);
                  return;
              }
              pos += direction * 0.5;
              if (pos > 55 || pos < 45) direction *= -1;

              overlay.style.width = `${pos}%`;
              handle.style.left = `${pos}%`;
          }, 20);

          setTimeout(() => clearInterval(animate), 1500);
      }, 800);
    });
  </script>
