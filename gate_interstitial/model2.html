<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate.tr Interstitial - Model 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', 'Segoe UI', sans-serif;
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .ad-container {
            width: 320px;
            height: 480px;
            background: linear-gradient(180deg, #0e1114 0%, #1a2329 100%);
            position: relative;
            overflow: hidden;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 12px;
            border: 1px solid #333;
        }

        /* Close Button */
        .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Tech Grid Background */
        .tech-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image:
                radial-gradient(circle, rgba(0, 211, 149, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            transform: perspective(500px) rotateX(20deg);
            animation: moveGrid 15s linear infinite;
            z-index: 1;
        }

        @keyframes moveGrid {
            0% { transform: perspective(500px) rotateX(20deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(20deg) translateY(30px); }
        }

        /* Content Wrapper */
        .content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 25px 20px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            margin-right: 10px;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            color: white;
            letter-spacing: 0.5px;
        }

        .brand-name span {
            color: #00D395;
        }

        /* Market Cards */
        .market-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: auto;
        }

        .market-card {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid #00D395;
            padding: 12px 15px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transform: translateX(-20px);
            animation: slideIn 0.5s ease-out forwards;
        }

        .market-card:nth-child(1) { animation-delay: 0.2s; }
        .market-card:nth-child(2) { animation-delay: 0.4s; }
        .market-card:nth-child(3) { animation-delay: 0.6s; }

        .coin-info h3 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .coin-info span {
            font-size: 11px;
            color: #888;
        }

        .coin-price {
            text-align: right;
        }

        .price-val {
            font-size: 14px;
            font-weight: 600;
            color: white;
            display: block;
        }

        .price-change {
            font-size: 12px;
            color: #00D395;
            font-weight: 500;
        }

        .price-change.down {
            color: #ff4d4d;
        }

        /* Main Copy */
        .hero-text {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 20px;
        }

        .hero-text h2 {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #fff, #bbb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            font-size: 13px;
            color: #8899a6;
            max-width: 80%;
            margin: 0 auto;
        }

        /* CTA */
        .cta-container {
            text-align: center;
            margin-bottom: 10px;
        }

        .cta-btn {
            background: #00D395;
            color: #000;
            font-weight: 700;
            text-decoration: none;
            padding: 14px 0;
            width: 100%;
            display: block;
            border-radius: 8px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
        }

        .cta-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        /* Animations */
        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }

        /* Floating elements (Decorative) */
        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: #00D395;
            filter: blur(40px);
            opacity: 0.1;
            z-index: 0;
        }
        .c1 { width: 150px; height: 150px; top: -50px; right: -50px; animation: float 6s ease-in-out infinite; }
        .c2 { width: 100px; height: 100px; bottom: 50px; left: -30px; animation: float 8s ease-in-out infinite reverse; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(15px); }
        }

    </style>
</head>
<body>

    <div class="ad-container">
        <!-- Decorative Background -->
        <div class="tech-grid"></div>
        <div class="floating-circle c1"></div>
        <div class="floating-circle c2"></div>

        <button class="close-btn" id="closeBtn">&times;</button>

        <div class="content">
            <!-- Header -->
            <div class="header">
                <svg class="brand-logo" viewBox="0 0 100 100" fill="none">
                    <path d="M50 10C27.9086 10 10 27.9086 10 50C10 72.0914 27.9086 90 50 90C72.0914 90 90 72.0914 90 50" stroke="#00D395" stroke-width="10"/>
                    <path d="M90 50H50V25" stroke="#00D395" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <div class="brand-name">Gate<span>.tr</span></div>
            </div>

            <!-- Live Market Tickers (Simulated) -->
            <div class="market-list">
                <div class="market-card">
                    <div class="coin-info">
                        <h3>BTC / USDT</h3>
                        <span>Bitcoin</span>
                    </div>
                    <div class="coin-price">
                        <span class="price-val">$42,350.20</span>
                        <span class="price-change">+1.24%</span>
                    </div>
                </div>

                <div class="market-card">
                    <div class="coin-info">
                        <h3>ETH / USDT</h3>
                        <span>Ethereum</span>
                    </div>
                    <div class="coin-price">
                        <span class="price-val">$2,245.85</span>
                        <span class="price-change">+2.15%</span>
                    </div>
                </div>

                <div class="market-card" style="border-left-color: #ff4d4d;">
                    <div class="coin-info">
                        <h3>SOL / USDT</h3>
                        <span>Solana</span>
                    </div>
                    <div class="coin-price">
                        <span class="price-val">$98.40</span>
                        <span class="price-change down">-0.55%</span>
                    </div>
                </div>
            </div>

            <!-- Hero Text -->
            <div class="hero-text">
                <h2>Piyasayı<br>Yakalayın</h2>
                <p>1400+ Kripto para birimi ile sınırsız işlem yapın.</p>
            </div>

            <!-- CTA -->
            <div class="cta-container">
                <a href="https://www.gate.tr/tr" target="_blank" class="cta-btn">İşlem Yapmaya Başla</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const closeBtn = document.getElementById('closeBtn');
            const container = document.querySelector('.ad-container');

            // Close functionality
            closeBtn.addEventListener('click', () => {
                container.style.transition = 'opacity 0.5s, transform 0.5s';
                container.style.opacity = '0';
                container.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    // Logic to remove ad or callback
                    console.log('Ad closed');
                }, 500);
            });

            // Simulate Live Prices
            const prices = [
                { id: 0, base: 42350.20, volatility: 50 },
                { id: 1, base: 2245.85, volatility: 5 },
                { id: 2, base: 98.40, volatility: 0.2 }
            ];

            const priceEls = document.querySelectorAll('.price-val');

            setInterval(() => {
                prices.forEach((coin, index) => {
                    const change = (Math.random() - 0.5) * coin.volatility;
                    const newPrice = coin.base + change;

                    // Update stored base slightly to drift
                    coin.base = newPrice;

                    priceEls[index].textContent = '$' + newPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                    // Flash effect could go here
                });
            }, 2000);
        });
    </script>
</body>
</html>
