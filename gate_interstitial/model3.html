<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate.tr Interstitial - Model 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none; /* Prevent text selection during drag */
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .ad-container {
            width: 320px;
            height: 480px;
            background-color: #0d1318;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            border-radius: 16px;
        }

        /* Close Button */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 28px;
            height: 28px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
        }

        /* --- SCREEN 1: LOCKED --- */
        .screen-locked {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 20px;
            z-index: 2;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            background: radial-gradient(circle at 50% 30%, #1e2d3b 0%, #0d1318 70%);
        }

        .lock-icon-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .lock-circle {
            width: 100px;
            height: 100px;
            border: 2px solid #00D395;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 211, 149, 0.2);
            margin-bottom: 20px;
            position: relative;
        }

        .lock-circle::after {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #00D395;
            animation: spin 3s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .lock-svg {
            width: 40px;
            height: 40px;
            fill: #00D395;
        }

        .locked-text {
            color: white;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
        }

        .locked-sub {
            color: #8899a6;
            font-size: 14px;
            margin-top: 8px;
            text-align: center;
        }

        /* Slider */
        .slider-container {
            width: 100%;
            height: 56px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 28px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slider-text {
            position: absolute;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 600;
            pointer-events: none;
            animation: pulseText 2s infinite;
        }

        @keyframes pulseText { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }

        .slider-handle {
            width: 48px;
            height: 48px;
            background: #00D395;
            border-radius: 50%;
            position: relative;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 211, 149, 0.5);
            z-index: 10;
        }

        .arrow-right {
            border: solid #0d1318;
            border-width: 0 3px 3px 0;
            display: inline-block;
            padding: 4px;
            transform: rotate(-45deg);
            margin-left: -2px;
        }

        /* --- SCREEN 2: UNLOCKED (OFFER) --- */
        .screen-unlocked {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1; /* Behind locked screen initially */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        /* Confetti Effect (CSS only simple version) */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #00D395;
            animation: confetti-fall 3s linear infinite;
            opacity: 0;
        }
        .c-1 { left: 10%; animation-delay: 0s; background: #00D395; }
        .c-2 { left: 30%; animation-delay: 0.5s; background: white; }
        .c-3 { left: 50%; animation-delay: 1.2s; background: #00D395; }
        .c-4 { left: 70%; animation-delay: 2.5s; background: #444; }
        .c-5 { left: 90%; animation-delay: 0.8s; background: white; }

        @keyframes confetti-fall {
            0% { top: -10px; opacity: 1; transform: rotate(0deg); }
            100% { top: 100%; opacity: 0; transform: rotate(720deg); }
        }

        .logo-small {
            width: 50px;
            height: 50px;
            margin-bottom: 20px;
        }

        .success-title {
            font-size: 28px;
            font-weight: 800;
            color: white;
            margin-bottom: 10px;
            transform: scale(0.8);
            opacity: 0;
            transition: all 0.5s 0.3s;
        }

        .success-desc {
            font-size: 15px;
            color: #ccc;
            margin-bottom: 30px;
            line-height: 1.5;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s 0.5s;
        }

        .main-cta {
            background: #00D395;
            color: #0d1318;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 18px;
            box-shadow: 0 0 20px rgba(0, 211, 149, 0.4);
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.5s 0.7s;
        }

        .main-cta:hover {
            transform: translateY(18px) scale(1.05); /* keep translateY offset on hover */
        }

        /* States */
        .unlocked .screen-locked {
            transform: translateY(-100%);
            opacity: 0;
        }

        .unlocked .success-title { transform: scale(1); opacity: 1; }
        .unlocked .success-desc { transform: translateY(0); opacity: 1; }
        .unlocked .main-cta { transform: translateY(0); opacity: 1; }
        .unlocked .confetti { opacity: 1; }

    </style>
</head>
<body>

    <div class="ad-container" id="adContainer">
        <button class="close-btn" id="closeBtn">&times;</button>

        <!-- Screen 1 -->
        <div class="screen-locked" id="lockedScreen">
            <div class="lock-icon-container">
                <div class="lock-circle">
                    <svg class="lock-svg" viewBox="0 0 24 24">
                        <path d="M12 2C9.243 2 7 4.243 7 7V10H6C4.897 10 4 10.897 4 12V20C4 21.103 4.897 22 6 22H18C19.103 22 20 21.103 20 20V12C20 10.897 19.103 10 18 10H17V7C17 4.243 14.757 2 12 2ZM12 17C10.896 17 10 16.104 10 15C10 13.896 10.896 13 12 13C13.104 13 14 13.896 14 15C14 16.104 13.104 17 12 17ZM15 10H9V7C9 5.346 10.346 4 12 4C13.654 4 15 5.346 15 7V10Z"/>
                    </svg>
                </div>
                <h2 class="locked-text">Giriş Yapın</h2>
                <p class="locked-sub">Fırsatları kaçırmayın</p>
            </div>

            <div class="slider-container" id="sliderContainer">
                <div class="slider-text">Açmak için Kaydırın &gt;&gt;&gt;</div>
                <div class="slider-handle" id="sliderHandle">
                    <i class="arrow-right"></i>
                </div>
            </div>
        </div>

        <!-- Screen 2 -->
        <div class="screen-unlocked">
            <!-- Confetti -->
            <div class="confetti c-1"></div>
            <div class="confetti c-2"></div>
            <div class="confetti c-3"></div>
            <div class="confetti c-4"></div>
            <div class="confetti c-5"></div>

            <svg class="logo-small" viewBox="0 0 100 100" fill="none">
                 <path d="M50 10C27.9086 10 10 27.9086 10 50C10 72.0914 27.9086 90 50 90C72.0914 90 90 72.0914 90 50" stroke="#00D395" stroke-width="8"/>
                 <path d="M90 50H50V25" stroke="#00D395" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

            <h1 class="success-title">Gate.tr'ye<br>Hoş Geldiniz</h1>
            <p class="success-desc">En güvenli kripto borsasında<br>yerinizi hemen alın.</p>
            <a href="https://www.gate.tr/tr" target="_blank" class="main-cta">Hesap Oluştur</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('adContainer');
            const sliderHandle = document.getElementById('sliderHandle');
            const sliderContainer = document.getElementById('sliderContainer');
            const closeBtn = document.getElementById('closeBtn');

            let isDragging = false;
            let startX, currentX;
            const maxSlide = 320 - 40 - 48 - 8; // approx width calculation

            // Touch events
            sliderHandle.addEventListener('touchstart', dragStart);
            sliderHandle.addEventListener('touchmove', drag);
            sliderHandle.addEventListener('touchend', dragEnd);

            // Mouse events
            sliderHandle.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);

            function dragStart(e) {
                isDragging = true;
                startX = e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
                sliderHandle.style.transition = 'none';
            }

            function drag(e) {
                if (!isDragging) return;

                const clientX = e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
                const moveX = clientX - startX;
                const containerWidth = sliderContainer.clientWidth;
                const handleWidth = sliderHandle.clientWidth;
                const maxMove = containerWidth - handleWidth - 8; // 8 is padding

                // Clamping
                let newLeft = Math.max(0, Math.min(moveX, maxMove));

                sliderHandle.style.transform = `translateX(${newLeft}px)`;

                // Opacity of text
                const opacity = 1 - (newLeft / maxMove);
                document.querySelector('.slider-text').style.opacity = opacity;

                // Threshold to unlock
                if (newLeft >= maxMove * 0.9) {
                    unlock();
                }
            }

            function dragEnd() {
                if (!isDragging) return;
                isDragging = false;

                // If not unlocked, snap back
                if (!container.classList.contains('unlocked')) {
                    sliderHandle.style.transition = 'transform 0.3s';
                    sliderHandle.style.transform = 'translateX(0)';
                    document.querySelector('.slider-text').style.opacity = '1';
                }
            }

            function unlock() {
                isDragging = false;
                container.classList.add('unlocked');
            }

            // Close Logic
            closeBtn.addEventListener('click', () => {
                container.style.opacity = '0';
                setTimeout(() => console.log('Ad closed'), 500);
            });

            // Auto-demo (for users who don't interact quickly - optional)
            /*
            setTimeout(() => {
                if(!container.classList.contains('unlocked')) {
                    sliderHandle.style.transition = 'transform 1s ease-in-out';
                    sliderHandle.style.transform = `translateX(250px)`;
                    setTimeout(unlock, 1000);
                }
            }, 3000);
            */
        });
    </script>
</body>
</html>
