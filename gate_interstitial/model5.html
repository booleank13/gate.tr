<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate.tr Launch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1318;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .ad-container {
            width: 320px;
            height: 480px;
            background: linear-gradient(to bottom, #001f3f, #0d1318);
            position: relative;
            overflow: hidden;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 8px; /* Optional rounded corners */
        }

        /* Close Button */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 18px;
            line-height: 24px;
            cursor: pointer;
            z-index: 100;
            transition: background 0.3s;
        }
        .close-btn:hover { background: rgba(255, 255, 255, 0.4); }

        /* Stars Background */
        .stars {
            position: absolute;
            width: 100%;
            height: 200%;
            background-image:
                radial-gradient(1px 1px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 160px 120px, #ddd, rgba(0,0,0,0));
            background-size: 200px 200px;
            background-repeat: repeat;
            top: -100%;
            z-index: 1;
        }

        .stars.moving {
            animation: starsMove 0.5s linear infinite;
        }

        @keyframes starsMove {
            from { transform: translateY(0); }
            to { transform: translateY(100px); }
        }

        /* Initial UI */
        .intro-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 80px;
            transition: opacity 0.5s;
        }

        .intro-text h2 {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            text-shadow: 0 0 10px #00D395;
        }

        .intro-text p {
            font-size: 14px;
            text-align: center;
            color: #ccc;
            margin-top: 10px;
        }

        .launch-btn {
            background: #00D395;
            color: #0d1318;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 211, 149, 0.6);
            cursor: pointer;
            animation: pulseBtn 1.5s infinite;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 211, 149, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 211, 149, 0.9); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 211, 149, 0.6); }
        }

        /* Rocket */
        .rocket-container {
            position: absolute;
            bottom: -50px; /* Start hidden or slightly visible */
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            transition: bottom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Show rocket initially */
        .rocket-container.ready {
            bottom: 150px;
        }

        .rocket {
            width: 60px;
            height: 100px;
            position: relative;
        }

        .rocket-body {
            width: 40px;
            height: 80px;
            background: #fff;
            border-radius: 50% 50% 10px 10px;
            position: absolute;
            top: 0;
            left: 10px;
            z-index: 2;
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.2);
        }

        .rocket-window {
            width: 16px;
            height: 16px;
            background: #00D395;
            border: 3px solid #ccc;
            border-radius: 50%;
            position: absolute;
            top: 20px;
            left: 12px;
        }

        .fin {
            width: 20px;
            height: 30px;
            background: #d32f2f;
            position: absolute;
            bottom: 20px;
            z-index: 1;
        }
        .fin-left { left: 0; border-radius: 100% 0 0 0; }
        .fin-right { right: 0; border-radius: 0 100% 0 0; }
        .fin-center {
            left: 20px;
            width: 20px;
            height: 20px;
            background: #d32f2f;
            bottom: 20px;
            transform: rotate(45deg);
            display: none; /* simplified */
        }

        .flame {
            position: absolute;
            bottom: -30px;
            left: 20px;
            transform: translateX(-50%);
            width: 20px;
            height: 40px;
            background: linear-gradient(#ffeb3b, #ff9800, #f44336, transparent);
            border-radius: 50% 50% 20% 20%;
            filter: blur(2px);
            opacity: 0;
            z-index: 1;
        }

        .rocket-container.launching {
            animation: rocketShake 0.5s linear infinite;
        }

        .rocket-container.launching .flame {
            opacity: 1;
            animation: flameFlicker 0.1s infinite alternate;
        }

        .rocket-container.flying {
            animation: rocketFly 2s forwards ease-in;
        }

        @keyframes rocketShake {
            0% { transform: translateX(-52%); }
            50% { transform: translateX(-48%); }
            100% { transform: translateX(-50%); }
        }

        @keyframes flameFlicker {
            from { height: 40px; }
            to { height: 50px; }
        }

        @keyframes rocketFly {
            0% { bottom: 150px; transform: translateX(-50%) scale(1); }
            100% { bottom: 600px; transform: translateX(-50%) scale(0.8); }
        }

        /* Final Result */
        .result-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s;
        }

        .result-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .gate-logo-img {
            width: 120px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .result-title {
            font-size: 24px;
            color: #00D395;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-align: center;
        }

        .result-sub {
            color: white;
            font-size: 16px;
            text-align: center;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .final-cta {
            background: #00D395;
            color: #0d1318;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 0 15px #00D395;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const closeBtn = document.getElementById('closeBtn');
            const launchBtn = document.getElementById('launchBtn');
            const introUi = document.getElementById('introUi');
            const rocket = document.getElementById('rocket');
            const stars = document.getElementById('stars');
            const resultOverlay = document.getElementById('resultOverlay');

            closeBtn.addEventListener('click', () => {
                const container = document.querySelector('.ad-container');
                container.style.transition = 'opacity 0.5s';
                container.style.opacity = '0';
            });

            launchBtn.addEventListener('click', () => {
                // 1. Hide UI
                introUi.style.opacity = '0';

                // 2. Start Ignition
                rocket.classList.add('launching');

                setTimeout(() => {
                    introUi.style.display = 'none';

                    // 3. Launch!
                    rocket.classList.remove('launching');
                    rocket.classList.add('flying');
                    stars.classList.add('moving');

                    // 4. Show Result after flight
                    setTimeout(() => {
                        resultOverlay.classList.add('show');
                    }, 1800);

                }, 1000);
            });
        });
    </script>
