<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate.tr Crypto Catcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            touch-action: none; /* Prevent default touch scrolling */
        }

        body {
            background-color: #0d1318;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .ad-container {
            width: 320px;
            height: 480px;
            background: linear-gradient(135deg, #1a2a3a 0%, #0d1318 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 8px;
        }

        /* Close Button */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 18px;
            line-height: 24px;
            cursor: pointer;
            z-index: 100;
        }

        /* Game UI */
        .game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allow clicks to pass through to game area */
            z-index: 10;
        }

        .score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 15px;
            border: 1px solid #00D395;
        }

        .instruction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            width: 100%;
            animation: pulse 1s infinite alternate;
        }

        .instruction.hide {
            display: none;
        }

        @keyframes pulse {
            from { opacity: 0.8; transform: translate(-50%, -50%) scale(0.95); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }

        /* Game Elements */
        .catcher {
            position: absolute;
            bottom: 20px;
            left: 50%; /* Start center */
            transform: translateX(-50%);
            width: 80px;
            height: 60px;
            background: #2a2a2a;
            border: 2px solid #00D395;
            border-radius: 0 0 15px 15px;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 211, 149, 0.3);
        }

        .catcher::after {
            content: 'Gate.tr';
            color: #00D395;
            font-weight: bold;
            font-size: 14px;
        }

        .catcher-lid {
            position: absolute;
            top: -10px;
            width: 90px;
            height: 10px;
            background: #333;
            border-radius: 5px;
        }

        .coin {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #f7931a; /* BTC orange default */
            border: 2px solid #fff;
            z-index: 4;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            font-size: 10px;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Result Overlay */
        .result-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 19, 24, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .result-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .logo-img {
            width: 100px;
            margin-bottom: 20px;
            animation: bounceIn 0.8s;
        }

        .win-title {
            font-size: 28px;
            color: #00D395;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        .win-desc {
            color: white;
            font-size: 16px;
            text-align: center;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .cta-btn {
            background: #00D395;
            color: #0d1318;
            padding: 12px 35px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 0 20px rgba(0, 211, 149, 0.5);
            animation: pulseBtn 1.5s infinite;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Particle effects */
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #00D395;
            pointer-events: none;
            border-radius: 50%;
        }

    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.ad-container');
            const closeBtn = document.getElementById('closeBtn');
            const catcher = document.getElementById('catcher');
            const scoreEl = document.getElementById('score');
            const instruction = document.getElementById('instruction');
            const resultOverlay = document.getElementById('resultOverlay');

            let score = 0;
            const targetScore = 5;
            let gameActive = false;
            let coins = [];

            // Mouse/Touch Drag Logic
            let isDragging = false;

            const updateCatcherPos = (clientX) => {
                if (!gameActive && score < targetScore) {
                    gameActive = true;
                    instruction.classList.add('hide');
                    spawnCoins();
                }
                const rect = container.getBoundingClientRect();
                let x = clientX - rect.left;

                // Clamp
                x = Math.max(40, Math.min(x, rect.width - 40));

                catcher.style.left = x + 'px';
            };

            container.addEventListener('mousemove', (e) => {
                updateCatcherPos(e.clientX);
            });

            container.addEventListener('touchmove', (e) => {
                e.preventDefault(); // Stop scroll
                updateCatcherPos(e.touches[0].clientX);
            }, { passive: false });

            closeBtn.addEventListener('click', () => {
                container.style.display = 'none';
            });

            // Coin Logic
            function spawnCoins() {
                if (!gameActive) return;

                const interval = setInterval(() => {
                    if (!gameActive) {
                        clearInterval(interval);
                        return;
                    }
                    createCoin();
                }, 800);
            }

            function createCoin() {
                const coin = document.createElement('div');
                coin.classList.add('coin');
                coin.innerText = Math.random() > 0.5 ? 'GATE' : 'BTC';

                // Random X pos
                const x = Math.random() * (320 - 40) + 10;
                coin.style.left = x + 'px';
                coin.style.top = '-40px';

                // Random color
                if (coin.innerText === 'GATE') {
                    coin.style.background = '#00D395';
                    coin.style.color = '#000';
                }

                container.appendChild(coin);
                coins.push({ el: coin, y: -40, speed: Math.random() * 2 + 3 });
            }

            // Game Loop
            function gameLoop() {
                if (!gameActive) {
                    if (score < targetScore) requestAnimationFrame(gameLoop);
                    return;
                }

                coins.forEach((coinObj, index) => {
                    coinObj.y += coinObj.speed;
                    coinObj.el.style.top = coinObj.y + 'px';

                    // Check Collision
                    const catcherRect = catcher.getBoundingClientRect();
                    const coinRect = coinObj.el.getBoundingClientRect();
                    const containerRect = container.getBoundingClientRect();

                    // Relative coords collision check roughly
                    if (coinObj.y > (480 - 80) && coinObj.y < (480 - 20)) {
                        const catcherCenter = parseFloat(catcher.style.left);
                        const coinCenter = parseFloat(coinObj.el.style.left) + 15;

                        if (Math.abs(catcherCenter - coinCenter) < 45) {
                            // Caught!
                            score++;
                            scoreEl.innerText = score;

                            // Effect
                            createParticle(coinCenter, 420);

                            // Remove
                            coinObj.el.remove();
                            coins.splice(index, 1);

                            // Win Condition
                            if (score >= targetScore) {
                                endGame();
                            }
                        }
                    }

                    // Missed
                    if (coinObj.y > 500) {
                        coinObj.el.remove();
                        coins.splice(index, 1);
                    }
                });

                requestAnimationFrame(gameLoop);
            }

            function createParticle(x, y) {
                for(let i=0; i<5; i++) {
                    const p = document.createElement('div');
                    p.classList.add('particle');
                    p.style.left = x + 'px';
                    p.style.top = y + 'px';
                    container.appendChild(p);

                    const angle = Math.random() * Math.PI * 2;
                    const vel = Math.random() * 5;
                    const dx = Math.cos(angle) * vel;
                    const dy = Math.sin(angle) * vel;

                    let frame = 0;
                    function anim() {
                        frame++;
                        p.style.left = (parseFloat(p.style.left) + dx) + 'px';
                        p.style.top = (parseFloat(p.style.top) + dy) + 'px';
                        p.style.opacity = 1 - (frame/20);

                        if(frame < 20) requestAnimationFrame(anim);
                        else p.remove();
                    }
                    anim();
                }
            }

            function endGame() {
                gameActive = false;
                setTimeout(() => {
                    resultOverlay.classList.add('show');
                }, 500);
            }

            // Start loop
            requestAnimationFrame(gameLoop);
        });
    </script>
