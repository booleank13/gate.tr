<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate.tr Trading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1318;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .ad-container {
            width: 320px;
            height: 480px;
            background: #111;
            position: relative;
            overflow: hidden;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }

        /* Close Button */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #aaa;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 18px;
            line-height: 24px;
            cursor: pointer;
            z-index: 100;
        }
        .close-btn:hover { background: rgba(255, 255, 255, 0.2); color: white; }

        /* Grid Background */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        /* Top Bar */
        .top-bar {
            padding: 20px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ticker {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: bold;
            color: #eb4d5c; /* Bearish initially */
        }

        .ticker-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 2px;
        }

        /* Chart Area */
        .chart-area {
            flex-grow: 1;
            position: relative;
            z-index: 5;
            overflow: hidden;
        }

        .candle {
            position: absolute;
            width: 10px;
            bottom: 50%; /* Center line */
            background: #eb4d5c;
            transform-origin: bottom;
            animation: none;
        }

        /* Dynamic candles generated by JS */

        .main-line {
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.1);
            border-top: 1px dashed rgba(255,255,255,0.2);
        }

        /* Controls */
        .controls {
            padding: 20px;
            z-index: 10;
            text-align: center;
            background: linear-gradient(to top, #000, transparent);
        }

        .action-btn {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 12px 30px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn:hover {
            background: #333;
            border-color: #666;
        }

        .action-btn.active {
            background: #00D395;
            color: #000;
            border-color: #00D395;
            box-shadow: 0 0 20px rgba(0, 211, 149, 0.5);
        }

        /* Overlay Result */
        .result-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 19, 24, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .result-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .logo-img {
            width: 80px;
            margin-bottom: 20px;
        }

        .profit-text {
            font-size: 36px;
            font-weight: 900;
            color: #00D395;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 211, 149, 0.5);
            transform: scale(0.5);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-overlay.show .profit-text {
            transform: scale(1);
        }

        .sub-text {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 30px;
        }

        .cta-final {
            background: #00D395;
            color: #000;
            text-decoration: none;
            padding: 12px 40px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
        }

        /* Animations */
        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 rgba(0, 211, 149, 0); }
            50% { box-shadow: 0 0 20px rgba(0, 211, 149, 0.5); }
            100% { box-shadow: 0 0 0 rgba(0, 211, 149, 0); }
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: -10px;
            width: 2px;
            height: 100%;
            background: #00D395;
            box-shadow: 0 0 10px #00D395;
            opacity: 0;
        }

        .scanning .scanner-line {
            opacity: 1;
            animation: scan 2s linear forwards;
        }

        @keyframes scan {
            0% { left: 0; }
            100% { left: 100%; }
        }

        .big-candle {
            position: absolute;
            right: 40px;
            bottom: 50%;
            width: 30px;
            height: 0;
            background: #00D395;
            box-shadow: 0 0 15px rgba(0, 211, 149, 0.4);
            transition: height 0.5s ease-out;
        }

    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const closeBtn = document.getElementById('closeBtn');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const chartArea = document.getElementById('chartArea');
            const resultOverlay = document.getElementById('resultOverlay');
            const tickerValue = document.getElementById('tickerValue');
            const changeValue = document.getElementById('changeValue');
            const breakoutCandle = document.getElementById('breakoutCandle');

            // Random small movements for ticker
            let price = 42150.00;
            const updateTicker = () => {
                const diff = (Math.random() - 0.5) * 20;
                price += diff;
                tickerValue.innerText = price.toFixed(2);
                tickerValue.style.color = diff > 0 ? '#00D395' : '#eb4d5c';
            };
            const tickerInterval = setInterval(updateTicker, 500);

            // Generate random candles
            for (let i = 0; i < 20; i++) {
                const candle = document.createElement('div');
                candle.classList.add('candle');
                candle.style.left = (i * 12) + 'px';

                const height = Math.random() * 30 + 5;
                const isGreen = Math.random() > 0.5;

                candle.style.height = height + 'px';
                candle.style.backgroundColor = isGreen ? '#00D395' : '#eb4d5c';

                // Random position relative to center
                const offset = (Math.random() - 0.5) * 40;
                candle.style.bottom = (200 + offset) + 'px'; // approx center of 400px high area

                chartArea.appendChild(candle);
            }

            closeBtn.addEventListener('click', () => {
                document.querySelector('.ad-container').style.display = 'none';
            });

            analyzeBtn.addEventListener('click', () => {
                // 1. Activate Button
                analyzeBtn.classList.add('active');
                analyzeBtn.innerText = "Analiz Yapılıyor...";

                // 2. Start Scanner
                chartArea.classList.add('scanning');

                setTimeout(() => {
                    // 3. Breakout!
                    breakoutCandle.style.height = '180px';
                    tickerValue.innerText = "43,500.00";
                    tickerValue.style.color = "#00D395";
                    changeValue.innerText = "+3.20%";
                    changeValue.style.color = "#00D395";

                    // 4. Show Result
                    setTimeout(() => {
                        resultOverlay.classList.add('show');
                        clearInterval(tickerInterval);
                    }, 1000);

                }, 1500);
            });
        });
    </script>
