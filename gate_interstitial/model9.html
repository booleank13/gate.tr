<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate.tr - Boğa vs Ayı</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 320px;
            height: 480px;
            background-color: #0d1217;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 1px solid #333;
            user-select: none;
        }

        #close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            font-weight: bold;
            font-size: 16px;
        }

        .logo {
            margin-top: 20px;
            width: 100px;
            height: auto;
            background-color: white;
            padding: 5px;
            border-radius: 8px;
            z-index: 10;
        }

        .game-container {
            flex-grow: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .bar-container {
            width: 40px;
            height: 250px;
            background: #222;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            border: 2px solid #555;
        }

        .bar-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, #ff4d4d, #00D395);
            transition: height 0.1s;
        }

        .icon {
            font-size: 40px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            transition: top 0.1s;
        }

        .bull {
            top: 20px; /* Moves down as bear wins */
            z-index: 5;
        }

        .bear {
            bottom: 20px;
            z-index: 5;
        }

        .tap-area {
            margin-top: 20px;
            width: 100px;
            height: 100px;
            background: #00D395;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            color: #0d1217;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 211, 149, 0.5);
            animation: pulseBtn 1s infinite;
        }

        .tap-area:active {
            transform: scale(0.95);
            background: #00a876;
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 20px rgba(0, 211, 149, 0.5); }
            50% { box-shadow: 0 0 40px rgba(0, 211, 149, 0.8); }
            100% { box-shadow: 0 0 20px rgba(0, 211, 149, 0.5); }
        }

        .status-text {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #00D395;
            text-align: center;
            height: 30px;
        }

        .win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 18, 23, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }

        .btn-main {
            background-color: #00D395;
            color: #0d1217;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 211, 149, 0.4);
        }

    </style>
</head>

    <div class="status-text">Boğaları Destekle!</div>

    <div class="game-container">
        <div class="bar-container">
            <div class="bar-fill" id="bar-fill"></div>
            <div class="icon bull" style="top: 0">🐂</div>
            <div class="icon bear" style="bottom: 0">🐻</div>
        </div>

        <div class="tap-area" id="tap-btn">TIKLA</div>
    </div>

    <div class="win-overlay" id="win-overlay">
        <h2 style="color: #00D395; font-size: 32px; margin: 0;">KAZANDIN!</h2>
        <p style="font-size: 18px; margin-top: 10px;">Boğa Piyasası Başladı</p>
        <button class="btn-main" onclick="window.location.href='https://www.gate.com/tr'">Yatırım Yap</button>
    </div>

    <script>
        const fill = document.getElementById('bar-fill');
        const tapBtn = document.getElementById('tap-btn');
        const overlay = document.getElementById('win-overlay');
        const closeBtn = document.getElementById('close-btn');

        let level = 50;
        let gameActive = true;

        closeBtn.addEventListener('click', () => {
             window.location.href = 'https://www.gate.com/tr';
        });

        tapBtn.addEventListener('mousedown', hit);
        tapBtn.addEventListener('touchstart', (e) => { e.preventDefault(); hit(); });

        function hit() {
            if (!gameActive) return;
            level += 5;
            update();
        }

        // Bear fights back
        setInterval(() => {
            if (!gameActive) return;
            level -= 1; // Constant pressure
            update();
        }, 50);

        function update() {
            if (level < 0) level = 0;
            if (level > 100) {
                level = 100;
                win();
            }

            fill.style.height = level + '%';
        }

        function win() {
            gameActive = false;
            overlay.style.display = 'flex';
        }
    </script>
